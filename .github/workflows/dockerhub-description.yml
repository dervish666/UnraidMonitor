name: Update Docker Hub Description

on:
  push:
    branches: [master]
    paths: [README.md]
  workflow_dispatch:

jobs:
  update-description:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: dervish/unraidmonitorbot
          short-description: "Telegram bot for monitoring Unraid servers with AI diagnostics and container control"

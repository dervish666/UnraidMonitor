name: Release

# Push a tag like v0.23.0 to publish dervish/unraidmonitorbot:v0.23.0 and
# :latest. Needs repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
# (a Docker Hub access token with read/write on the repository).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push linux/amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The version lives in two places; a tag that disagrees with either
      # would publish an image that reports the wrong version.
      - name: Tag matches pyproject.toml and src/__init__.py
        run: |
          python3 - <<'PY'
          import os, re, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          with open("pyproject.toml", "rb") as f:
              project = tomllib.load(f)["project"]["version"]
          init = re.search(r'__version__\s*=\s*"([^"]+)"', open("src/__init__.py").read()).group(1)
          if not (tag == project == init):
              sys.exit(f"tag {tag}, pyproject {project}, src/__init__.py {init}: they must all match")
          print(f"Releasing {tag}")
          PY

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            dervish/unraidmonitorbot:${{ github.ref_name }}
            dervish/unraidmonitorbot:latest

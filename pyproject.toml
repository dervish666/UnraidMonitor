[project]
name = "unraid-monitor-bot"
version = "0.17.0"
requires-python = ">=3.11"
dependencies = [
    "docker>=7.0.0,<8.0.0",
    "aiogram>=3.4.0,<4.0.0",
    "pyyaml>=6.0,<7.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "psutil>=6.1.0,<8.0.0",
    # aiogram caps aiohttp <3.14; CVE-2026-34993/CVE-2026-47265 (fixed in 3.14)
    # are not exploitable here (no CookieJar.load, no per-request cookies) —
    # ignored in CI pip-audit. Lift floor to >=3.14 when aiogram allows it.
    "aiohttp>=3.13.5,<4.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
ai = [
    "anthropic>=0.40.0,<1.0.0",
    "openai>=2.0.0,<3.0.0",
]
dev = [
    "types-PyYAML>=6.0",
    "types-psutil>=6.0",
    "types-docker>=7.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "mypy>=1.20",
    "pip-audit>=2.7",
    "anthropic>=0.40.0,<1.0.0",
    "openai>=2.0.0,<3.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

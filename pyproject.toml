[project]
name = "unraid-monitor-bot"
version = "0.21.1"
requires-python = ">=3.11"
dependencies = [
    "docker>=7.0.0,<8.0.0",
    "aiogram>=3.30.0,<4.0.0",
    "pyyaml>=6.0,<7.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "psutil>=6.1.0,<8.0.0",
    # aiogram >=3.30 allows aiohttp <3.15. Floor raised to 3.14.3 for
    # PYSEC-2026-3545, an out-of-bounds heap read in the C response parser
    # that a malformed server response can trigger in the client, which is
    # what we are. The other two in that batch need an aiohttp server
    # (PYSEC-2026-3546) or WebSockets (PYSEC-2026-3547); the bot long-polls
    # over HTTP and runs neither. CI pip-audit runs with no ignores.
    "aiohttp>=3.14.3,<4.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
ai = [
    "anthropic>=0.40.0,<1.0.0",
    "openai>=2.0.0,<3.0.0",
]
dev = [
    # Dev-only, and neither reaches the Docker image. Pinned so pip-audit
    # stays clean without an ignore list: cryptography arrives via
    # types-docker -> types-paramiko (PYSEC-2026-3552 is a PKCS#7 S/MIME
    # oracle we never touch), and pip is build tooling (PYSEC-2026-3721
    # needs a malicious package index).
    "cryptography>=50.0.0",
    "pip>=26.2",
    "types-PyYAML>=6.0",
    "types-psutil>=6.0",
    "types-docker>=7.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "mypy>=1.20",
    "pip-audit>=2.7",
    "anthropic>=0.40.0,<1.0.0",
    "openai>=2.0.0,<3.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
